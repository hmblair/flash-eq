name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      FLASH_EQ_SKIP_CUDA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv && uv pip install ruff
      - run: uv run ruff check flash_eq/ tests/

  test-cpu:
    runs-on: ubuntu-latest
    env:
      FLASH_EQ_SKIP_CUDA: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Install (CPU-only, no CUDA extension)
        run: |
          uv venv -p ${{ matrix.python-version }}
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"
      - name: Run non-CUDA tests
        run: uv run pytest tests/ -v -k "not cuda" --ignore=tests/test_patch.py

  # GPU tests require a GitHub Team/Enterprise plan with larger runners,
  # or a self-hosted runner with a CUDA GPU.
