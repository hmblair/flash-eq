name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build wheels in manylinux container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -e TORCH_CUDA_ARCH_LIST="8.0;8.9;9.0+PTX" \
            ghcr.io/hmblair/flash-eq-builder:latest \
            bash -c '
              VERSION=$(/opt/venv-3.12/bin/python -c "from setuptools_scm import get_version; print(get_version())")
              for pyver in 3.10 3.11 3.12 3.13; do
                echo "=== Building wheel for Python $pyver ==="
                . /opt/venv-$pyver/bin/activate
                SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION python setup.py bdist_wheel
                whl=$(ls -t dist/*.whl | head -1)
                python -c "import zipfile; z=zipfile.ZipFile(\"$whl\"); sos=[f for f in z.namelist() if f.endswith(\".so\")]; print(\"Extensions:\", sos); assert sos, \"No .so in wheel\""
                deactivate
              done
            '
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  test-wheels:
    needs: [build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - name: Test wheel imports
        run: |
          docker run --rm \
            -v "$PWD/dist":/dist \
            ghcr.io/hmblair/flash-eq-builder:latest \
            bash -c '
              for pyver in 3.10 3.11 3.12 3.13; do
                echo "=== Testing wheel for Python $pyver ==="
                . /opt/venv-$pyver/bin/activate
                cpver="cp${pyver//./}"
                pip install /dist/*${cpver}*.whl
                python -c "import flash_eq; print(\"Version:\", flash_eq.__version__); from flash_eq import Repr, EquivariantLinear, EquivariantEdgewiseLinear, WignerDBasis, EquivariantTransformer, Graph; print(\"All public imports OK\"); import importlib; spec = importlib.util.find_spec(\"flash_eq._block_diagonal_cuda\"); assert spec is not None, \"CUDA extension not found\"; print(\"CUDA extension found:\", spec.origin)"
                deactivate
              done
            '

  github-release:
    needs: [build-sdist, build-wheels, test-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  update-pip-index:
    needs: [github-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate PEP 503 index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/flash-eq
          gh api repos/${{ github.repository }}/releases --paginate --jq '
            .[].assets[] | select(.name | test("\\.(whl|tar\\.gz)$")) |
            "<a href=\"\(.browser_download_url)\">\(.name)</a><br/>"
          ' > site/flash-eq/index.html
          echo '<a href="flash-eq/">flash-eq</a>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
