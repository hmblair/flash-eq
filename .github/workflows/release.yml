name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    container:
      image: nvidia/cuda:12.9.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python and build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y software-properties-common git
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update && apt-get install -y python${{ matrix.python-version }} python${{ matrix.python-version }}-venv python${{ matrix.python-version }}-dev
          python${{ matrix.python-version }} -m venv /opt/venv
          . /opt/venv/bin/activate
          pip install torch --index-url https://download.pytorch.org/whl/cu129
          pip install build setuptools-scm wheel
      - name: Build wheel
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.9;9.0;10.0;12.0+PTX"
        run: |
          . /opt/venv/bin/activate
          python -m build --wheel --no-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl

  github-release:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
