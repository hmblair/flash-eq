name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.9.0-devel-ubuntu22.04
    steps:
      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y software-properties-common git
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update && apt-get install -y \
            python3.10 python3.10-venv python3.10-dev \
            python3.11 python3.11-venv python3.11-dev \
            python3.12 python3.12-venv python3.12-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version
        id: version
        run: |
          python3.12 -m venv /tmp/scm-env
          /tmp/scm-env/bin/pip install --no-cache-dir setuptools-scm
          VERSION=$(/tmp/scm-env/bin/python -c "from setuptools_scm import get_version; print(get_version())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build wheels for all Python versions
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.9;9.0;10.0;12.0+PTX"
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for pyver in 3.10 3.11 3.12; do
            echo "::group::Building wheel for Python $pyver"
            python$pyver -m venv /opt/venv-$pyver
            . /opt/venv-$pyver/bin/activate
            pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
            pip install --no-cache-dir build setuptools-scm wheel
            python -m build --wheel --no-isolation
            deactivate
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  github-release:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
