name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv venv && uv pip install build
      - run: uv run python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    container:
      image: pytorch/pytorch:2.8.0-cuda12.9-cudnn9-devel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build wheel
        env:
          # Ampere, Ada Lovelace, Hopper, Blackwell datacenter, Blackwell consumer + PTX
          TORCH_CUDA_ARCH_LIST: "8.0;8.9;9.0;10.0;12.0+PTX"
        run: |
          pip install build setuptools-scm wheel
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl

  github-release:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
