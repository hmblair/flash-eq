name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hmblair/flash-eq-builder:latest
    steps:
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version
        id: version
        run: |
          VERSION=$(/opt/venv-3.12/bin/python -c "from setuptools_scm import get_version; print(get_version())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build wheels for all Python versions
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.9;9.0;10.0;12.0+PTX"
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for pyver in 3.10 3.11 3.12; do
            echo "::group::Building wheel for Python $pyver"
            . /opt/venv-$pyver/bin/activate
            python -m build --wheel --no-isolation
            deactivate
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  github-release:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
