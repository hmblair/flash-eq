name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hmblair/flash-eq-builder:latest
    steps:
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version
        id: version
        run: |
          VERSION=$(/opt/venv-3.12/bin/python -c "from setuptools_scm import get_version; print(get_version())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build wheels for all Python versions
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.9;9.0;10.0;12.0+PTX"
          CUDA_HOME: /usr/local/cuda
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Verify CUDA extension will be built
          . /opt/venv-3.12/bin/activate
          python -c "
          import setup  # import setup.py as module
          " 2>&1 || true
          python -c "
          import os, torch
          print('CUDA_HOME:', os.environ.get('CUDA_HOME'))
          print('torch.cuda.is_available():', torch.cuda.is_available())
          print('Has CUDAExtension:', hasattr(torch.utils.cpp_extension, 'CUDAExtension'))
          "
          deactivate

          for pyver in 3.10 3.11 3.12; do
            echo "::group::Building wheel for Python $pyver"
            . /opt/venv-$pyver/bin/activate
            python setup.py build_ext bdist_wheel
            # Verify the wheel contains the .so
            whl=$(ls -t dist/*.whl | head -1)
            python -c "import zipfile; z=zipfile.ZipFile('$whl'); sos=[f for f in z.namelist() if f.endswith('.so')]; print('Extensions in wheel:', sos); assert sos, 'No .so found in wheel!'"
            deactivate
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  github-release:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
