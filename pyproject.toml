[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-eq"
dynamic = ["version"]
description = "Fast, memory-efficient SO(3)-equivariant linear layers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Hamish M. Blair", email = "hmblair@stanford.edu" }
]
keywords = ["equivariant", "SO3", "neural-networks", "geometric-deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "sphericart-torch>=1.0",
]

[project.urls]
Homepage = "https://github.com/hmblair/flash-eq"
Repository = "https://github.com/hmblair/flash-eq"
Issues = "https://github.com/hmblair/flash-eq/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scipy",
]

[tool.setuptools.packages.find]
include = ["flash_eq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools_scm]
version_file = "flash_eq/_version.py"

[tool.ruff.lint]
ignore = ["E741"]  # Allow 'l' as variable name (standard physics notation for angular momentum)
