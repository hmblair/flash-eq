[build-system]
requires = ["setuptools>=61.0", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-eq"
version = "0.1.0"
description = "Fast, memory-efficient SO(3)-equivariant linear layers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hamish Blair" }
]
keywords = ["equivariant", "SO3", "neural-networks", "geometric-deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scipy",
]

[tool.setuptools.packages.find]
include = ["flash_eq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
